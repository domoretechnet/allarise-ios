		FB00000000000000000000D1 /* Upload Crashlytics dSYMs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}",
				"$(BUILT_PRODUCTS_DIR)/$(INFOPLIST_PATH)",
				"$(SRCROOT)/HaWake Alarm V2/GoogleService-Info.plist",
				"$(BUILD_DIR)/../../SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run",
			);
			name = "Upload Crashlytics dSYMs";
			shellPath = /bin/sh;
			shellScript = (
				"# Uploads dSYMs so Crashlytics reports carry symbols instead of hex addresses.",
				"#",
				"# -gsp is explicit because user script sandboxing is ON: the phase can only",
				"# read paths declared in Input Files, and upload-symbols would otherwise go",
				"# looking for GoogleService-Info.plist inside the built .app and be denied.",
				"#",
				"# GoogleService-Info.plist is gitignored, so a fresh clone will not have one.",
				"# Skip rather than fail — that keeps the project buildable without Firebase",
				"# credentials, matching FirebaseBootstrap.configureIfNeeded().",
				"GSP=\"${SRCROOT}/HaWake Alarm V2/GoogleService-Info.plist\"",
				"if [ ! -f \"$GSP\" ]; then",
				"  echo \"note: GoogleService-Info.plist not present - skipping Crashlytics dSYM upload\"",
				"  exit 0",
				"fi",
				"\"${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run\" -gsp \"$GSP\"",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

